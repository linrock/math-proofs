  "project": {
    "name": "Erdős 968: total variation and decreasing steps of normalized primes",
    "description": "A Lean 4 formalization of the Erdős and Prachar (1961) companion theorems for normalized prime ratios in Erdős Problem 968. For the sequence obtained by dividing the n-th prime by n + 1, the development proves that the total variation over primes below x grows on the order of the square of log x and that the set of indices where the normalized prime ratio strictly decreases has positive lower asymptotic density. The proofs combine prime number theorem asymptotics with linear density bounds for large prime gaps.",

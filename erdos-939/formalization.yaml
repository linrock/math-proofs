    "scope": "Proves 24 theorems in Erdos939.Palomar across three proof modules in Proofs/. These cover the seven solved variants of FormalConjectures.ErdosProblems.939 (finite, infinite_of_six_le, triples, examples, seven, eight, euler), infinite families of coprime 3-powerful triples (Nitaj; Cohn, including non-cube triples), explicit witnesses at r = 5 (Cambie) and for the fifth-power Lander–Parkin identity, a squarefree-core decomposition of r-powerful numbers, the radical bound rad(prod S * sum S)^r < (sum S)^(r-1) with abc quality above r/(r-1), Walsh's quadratic-twist criteria, and the exact reduction erdos_939_iff_four_nonempty. Three further theorems are conditional only: finiteness of Erdos939Sums 4 under an abc bound with exponent 7/6, finiteness of Erdos939Sums 5 under a 5/4-exponent radical threshold, and a disproof of erdos_939 under a radical obstruction at r = 4. These hypotheses are not proved here. Whether (Erdos939Sums 4).Nonempty holds remains open, so erdos_939 itself is not resolved.",

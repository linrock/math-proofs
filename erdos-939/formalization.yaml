  "project": {
    "name": "Erdős 939: coprime sums of r-powerful numbers",
    "description": "A Lean 4 formalization of results on Erdős problem 939, which asks whether the sum of r − 2 coprime r-powerful positive integers can itself be r-powerful for r ≥ 4. Using Stijn Cambie's explicit witnesses for r = 5, 7 and 8 and Liam Price's binomial odd-power splitting construction, it proves that such sums exist for r = 5, 7 and 8 and that there are infinitely many for every r ≥ 6, so the solution sets are not finite. It also formalizes Nitaj's (1995) and Cohn's (1998) infinite families of coprime 3-powerful triples a + b = c, Walsh's (2024) quadratic-twist criteria, and the Lander–Parkin (1967) fifth-power counterexample to Euler's conjecture. The main conjecture remains open: it reduces exactly to r = 4, where a positive coprime 4-powerful pair with 4-powerful sum would need abc quality above 4/3, and finiteness there is shown only conditionally on abc-type bounds.",

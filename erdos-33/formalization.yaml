  "status": {
    "scope": "Proves both solved variants of Erdős problem 33 — the strict lower bound greater than 1 and van Doorn's 2φ^(5/2) upper bound — together with the rational lower bounds 5/4 = 1.25, 63/50 = 1.26 and 127/100 = 1.27 on the infimum. Those three bounds are finite-resolution instances of Cilleruelo's step-function method: the step sums S(60) = 2879, S(150) = 17815 and S(500) = 196830 are computed and kernel-checked here, and the resulting inequalities quantify over every additive complement. All three are weaker than the known asymptotic bound 4/π ≈ 1.2732 due to Cilleruelo (1993), Habsieger (1995) and Balasubramanian–Ramana (2001), so they do not improve the state of the art and do not close the main value question, whose exact value remains open.",
    "sorry_count": 0,
    "sorry_in_definitions": 0,

  "fidelity": {
    "divergences": "Challenge.lean, Statement.lean, and Solution.lean use the exact AdditiveBasisCondition definition and EReal limsup statements from FormalConjectures/ErdosProblems/33.lean, matched by FCCompare. That definition asks that every natural number be of the form a + n^2; the upstream docstring records that this was changed from 'every large integer' on the grounds that the two conditions are equivalent and that the original paper used the every-integer formulation. The package neither verifies that historical claim nor formalizes the finite-modification equivalence between the two conventions. No other divergence is intended: the two exported variant theorems are stated exactly as upstream, and the six remaining exported theorems are package-local auxiliary results with no upstream counterpart."
  },

  "project": {
    "name": "Erdős 33: additive complements to the squares",
    "description": "A Lean 4 formalization of the open problem asking for the smallest limsup of |A ∩ [1, N]| / √N over additive complements A of the squares, that is, sets A such that every natural number has the form a + n². The package proves both solved upstream variants: the strict lower bound above 1 and van Doorn's explicit Fibonacci block construction giving the upper bound 2φ^(5/2). It also derives the rational lower bounds 5/4, 63/50 and 127/100 for the infimum by evaluating Cilleruelo's step-function method at finite resolutions R = 60, 150 and 500, with every arithmetic input checked in the kernel. All three rational bounds are strictly weaker than the known asymptotic lower bound 4/π of Cilleruelo, Habsieger, and Balasubramanian–Ramana; the exact value of the infimum remains open.",
    "authors": [
      "Linmiao Xu"
    ],
    "responsible_maintainers": [
      "Linmiao Xu"
    ],
    "license": "Apache-2.0"
  },

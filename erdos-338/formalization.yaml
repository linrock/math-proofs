    "name": "Erdős 338: Hegyvári–Hennecart–Plagne restricted-order construction",
    "description": "A Lean 4 formalization of the 2007 construction of Hegyvári, Hennecart, and Plagne for Erdős Problem 338, which asks when an additive basis admits representations by distinct summands. For every order k at least two, the construction gives a set of integers that is a basis of exact order k and whose restricted order, the least number of distinct summands needed for all sufficiently large integers, equals 2 to the power k minus 2, plus k minus 1. The proofs establish both exact values. The general characterization of bases with finite restricted order, bounding restricted order in terms of basis order, the equality question, and the finite-removal questions remain open.",

  "project": {
    "name": "Erdős 306: semiprime unit fractions and incidence bounds",
    "description": "A Lean 4 formalization of Shisheng Li's 2026 elementary proof that every positive rational with squarefree reduced denominator is a finite sum of reciprocals of distinct semiprimes, ported from Li's companion development to Lean 4.35.0-rc2. The port replaces the two Rosser–Schoenfeld axioms used in Yuren Tang's earlier Lean development with Erdős's central-binomial Chebyshev bound. Diluting the same construction by the prime 3 yields the Butler–Erdős–Graham theorem that every positive integer is such a sum with denominators having three distinct prime factors. The package also proves finite incidence results for representations of 1: maximum prime incidence at least 10 is necessary and sufficient, incidence-ten representations have at least 61 terms and 63 when the term count is odd, and explicit 71-, 72-, and 73-term examples are certified.",
    "authors": [
      "Linmiao Xu"
    ],

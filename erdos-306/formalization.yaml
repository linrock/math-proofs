  "status": {
    "scope": "Proves the current Formal Conjectures statement erdos_306, namely that every positive rational with squarefree reduced denominator is a sum of reciprocals of distinct products of two distinct primes, and proves the upstream three-prime integer variant. The main theorem is a checked port of known mathematics, not a new solution or priority claim. For representations of 1 by distinct semiprime denominators, proves that maximum prime incidence at least 10 is necessary and sufficient, that incidence-10 representations have at least 61 terms and at least 63 when the number of terms is odd, and gives explicit 71-, 72-, and 73-term examples. The exact minimum number of terms in an incidence-10 representation is not determined; the smallest verified example has 68 terms.",

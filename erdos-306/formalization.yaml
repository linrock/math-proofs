    "name": "Erdős 306: unit fractions with semiprime denominators",
    "description": "A complete Lean 4 proof of Erdős problem 306: every positive rational number whose reduced denominator is squarefree is a finite sum of reciprocals of distinct integers, each the product of two distinct primes. The proof follows Shisheng Li’s September 2026 paper “Unit fractions with semiprime denominators: an elementary proof of Erdős Problem #306,” which counts subsets of a complete bipartite graph between two widely separated ranges of primes with a finite Fourier argument adapted from Yuren Tang’s earlier Lean proof, and needs only Chebyshev-type prime bounds where Tang assumed two Rosser–Schoenfeld estimates as axioms. Diluting the same construction by the prime 3 also proves the Butler–Erdős–Graham theorem that every positive integer is a sum of reciprocals of distinct products of three distinct primes. For representations of 1, the package further shows that some prime must divide at least ten of the denominators, which is sharp, and that when no prime divides more than ten, at least 61 terms are needed (63 for an odd number of terms), with explicit 71-, 72-, and 73-term examples.",

    "name": "Erdős 9: odd integers outside prime plus two powers",
    "description": "A Lean 4 formalization of Schinzel's and Crocker's 1971 infinitude theorem for Erdős Problem 9. Crocker's Fermat-factor divisibility and covering-congruence construction yields an explicit strictly increasing sequence of odd integers that cannot be written as a prime plus two powers of two. The package proves the resulting infinite exceptional family as an exact Formal Conjectures declaration, while whether that exceptional set has positive upper density remains open.",

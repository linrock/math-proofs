  "name": "Erdős 36: classical minimum-overlap bounds",
  "description": "A Lean 4 formalization of foundational results for Erdős's minimum overlap problem, posed in 1955. For balanced partitions of {1, ..., 2N}, the normalized minimum maximum difference overlap M(N)/N is subadditive and superadditive up to an additive constant, and a Fekete-type argument proves convergence to an asymptotic constant c. The formalization also proves classical lower and upper bounds due to Erdős (1/4 ≤ c ≤ 1/2), Scherk (1 - 1/√2 < c), Świerczkowski ((4 - √6)/5 < c), and Moser (√2/4 ≤ c), together with a combined Moser–Scherk quartic inequality and exact finite values through M(15) = 6. Determining the constant c remains open.",
    "authors": [
      "Linmiao Xu"
    ],
    "responsible_maintainers": [
      "Linmiao Xu"
    ],
    "license": "Apache-2.0"
  },

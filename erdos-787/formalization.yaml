    "name": "Erdős 787: logarithmic restricted sum-avoiding lower bound",
    "description": "A Lean 4 formalization of the logarithmic lower bound for Erdős Problem 787. For a finite set A of reals, the problem asks for the largest guaranteed subset B whose restricted pairwise sums avoid A. The package proves that some positive constant c satisfies c log n ≤ g(n) for all sufficiently large n, uniformly over every n-element set of reals. The proof peels the largest element of the positive or negative part, where each conflict removes at most one element per halving, and thereby obtains the explicit constant c = 1/16 from n = 1024 onward. The exact asymptotic order of g(n) remains open, and the stronger published bounds of Choi, Sanders, Ruzsa, and Beker are not formalized here.",
    "authors": [
      "Linmiao Xu"
    ],
    "responsible_maintainers": [
      "Linmiao Xu"
    ],
    "license": "Apache-2.0"
  },

      "id": "https://doi.org/10.1307/mmj/1331222852",
      "location": "Michigan Mathematical Journal 61 (2012), 151-160; preprint arXiv:1306.0765, Theorem 1(i) and Section 3",
      "author_endorsement": "not-contacted",
      "note": "Proves g(n) < n^alpha for sufficiently large n with some alpha < 1/2 (Section 3 shows 0.45 < alpha < 0.46 is admissible), where g(n) is the largest k admitting distinct primes p_i with p_i | (n+i) for 1 <= i <= k. Because two prime divisors exceeding k cannot divide both m+i and m+j for distinct i, j in [1, k] (their difference is smaller than k), the condition in Erdos962Prop forces the primes to be distinct, so k(n) <= max_{m <= n} g(m). Hence k(n) = O(n^alpha) with alpha < 0.46, which is asymptotically stronger than the pointwise bound k(n) <= sqrt n proved here. This package formalizes the upstream statement exactly; it does not improve on the literature bound."

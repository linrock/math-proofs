    "name": "Erdős 962: Tao's square-root upper bound",
    "description": "A Lean 4 formalization of Tao's square-root upper bound for Erdős Problem 962. For k(n), the largest run of consecutive integers below n each divisible by a prime exceeding the run length, a divisor-remainder obstruction proves the pointwise bound k(n) ≤ √n, which implies the upstream asymptotic statement exactly. Laishram and Murty (2012) prove a stronger asymptotic bound for the corresponding distinct-prime problem, which also applies to k(n); this package makes no claim of improving that literature. The main sub-exponential conjecture remains open, and Tang's matching lower-bound variant is not formalized here.",

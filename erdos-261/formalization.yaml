  "project": {
    "name": "Erdős 261: dyadic weighted representations n / 2^n = ∑ a_k / 2^(a_k)",
    "description": "A Lean 4 formalization of the solved parts, extremal bounds, and finite verification up to 10000 for Erdős problem 261 on representing n / 2^n as a finite sum ∑_{k=1}^t a_k / 2^(a_k) of distinct positive integers a_k. Proves the Borwein–Loring telescoping family n = 2^(m+1) - m - 2 (resolving Part (i) that infinitely many positive integers n admit such a representation), verifies every integer 1 ≤ n ≤ 10000 via a coalesced dyadic block certificate forest (Theorem 3.5 of Tengely, Ulas, and Zygadło 2020), constructs infinitely many rationals with at least 2^m distinct infinite representations for every m ∈ ℕ, and proves the Tengely–Ulas–Zygadło sharp extremal bound n ≤ 2^(t+1) - t - 2 and its equality uniqueness, first-term localization a_k ∈ [n+1, n+3], 2-adic last-gap divisibility 2^(a_{t+1} - a_t) ∣ a_{t+1}, the punctured-interval infinite family n_k = (2^(4k+2) + 1)/5 - 4k, and arbitrary-length splicing.",
    "authors": [
      "Linmiao Xu"
    ],
    "responsible_maintainers": [
      "Linmiao Xu"
    ],
    "license": "Apache-2.0"
  },

      "note": "Proves the sharp extremal upper bound n ≤ 2^{t+1} - t - 2 and its equality uniqueness (Theorem 2.1(i)), the first-term bound n + 1 ≤ a_1 ≤ n + 3 and last-term gap divisibility 2^{a_t - a_{t-1}} ∣ a_t (Theorem 2.1(ii)), the punctured-interval family n_k = (2^{4k+2} + 1)/5 - 4k (Theorem 3.1), and verifies that every positive integer n ≤ 10000 satisfies Erdos261Prop n (Theorem 3.5)."

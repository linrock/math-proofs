    "name": "Erdős 661: Lenz's construction in R^4",
    "description": "A Lean 4 formalization of Lenz's 1955 construction of two orthogonal circles in R^4, each of radius 1/sqrt 2, carrying n points apiece with every cross-distance equal to 1. Erdős's 1997 problem collection poses the asymptotic distinct-distance question, while his 1960 paper records Lenz's earlier construction, and the proof here follows the construction through a rational parametrization of the circle. The package also records the textbook planar comparison inequality F(n) ≤ f(2n), which already carries a complete inline proof upstream; that comparison is a supporting control rather than a new contribution. The main asymptotic question and the little-o comparison remain open.",

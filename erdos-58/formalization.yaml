    "name": "Erdős 58: odd cycle lengths and chromatic number",
    "description": "A complete Lean 4 proof of the theorem of Gyárfás (1992) that a simple graph with at most k distinct odd simple-cycle lengths has chromatic number at most 2k + 2, with equality exactly when the graph contains a copy of the complete graph on 2k + 2 vertices. The argument reconstructs Gyárfás's longest-odd-cycle and common-contact analysis from the published exposition, combining a normal-depth forest coloring bound, a finite vertex-critical core, and explicit path and cycle witnesses. Finite-target coloring compactness then removes the finiteness restriction on the vertex type, so infinite graphs with only finitely many odd-cycle lengths are included. This is an independent formalization of the statement rather than the first one; two related public Lean developments are recorded in the manifest.",

name = "Erdos58"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution", "AxiomAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "Proofs58"
srcDir = "Proofs"
roots = [
  "Layer158",
  "Layer258",
  "OddCycleExtraction108",
  "Layer358",
  "Layer458",
  "Layer558",
  "Layer658",
  "Layer758",
  "Layer858",
  "Layer958",
  "Layer1058",
  "Layer1158",
  "Layer1258",
  "Layer1358"
]
moreLeanArgs = ["-j1", "-M8192", "-E", "hasSorry", "-Dweak.exposeDefinitions=true"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
moreLeanArgs = ["-j1", "-M8192"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
moreLeanArgs = ["-j1", "-M8192", "-E", "hasSorry"]

[[lean_lib]]
name = "AxiomAudit"
roots = ["AxiomAudit"]
moreLeanArgs = ["-j1", "-M8192", "-E", "hasSorry"]

[[lean_lib]]
name = "Statement"
roots = ["Statement"]
moreLeanArgs = ["-j1", "-M8192", "-E", "hasSorry"]

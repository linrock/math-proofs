  "project": {
    "name": "Erdős 1122: rigidity of additive functions with sparse descents",
    "description": "A Lean 4 formalization of Erdős's 1946 rigidity theorems for additive arithmetic functions, whose descent set A = {n ≥ 1 : f(n + 1) < f(n)} is measured by its counting function on [1, X]. For f : ℕ → ℝ additive on coprime arguments, the package proves that an empty descent set, and separately that f(n + 1) - f(n) = o(1), each force f(n) = c log n for a single real c, in the form the two solved variants take on erdosproblems.com. It also develops the coprime-sandwich and dyadic-shell machinery behind Erdős's argument and reduces the package's descent-count formulation of the main conjecture to bounded downward jumps together with a dyadic-shell oscillation or downward-drift hypothesis; a formal bridge from that formulation to the upstream hypothesis that the descent set has natural density zero is not included.",

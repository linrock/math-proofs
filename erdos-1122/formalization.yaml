  "status": {
    "scope": "Proves the two upstream variants erdos_1122.variants.monotone and erdos_1122.variants.sub_tendsto_zero (Erdős 1946), which are the declarations the package targets in FormalConjectures/ErdosProblems/1122.lean. The main conjecture erdos_1122 remains open and is not proved or disproved. The package also proves 28 auxiliary theorems in the Erdos1122.Core namespace. Among these, the coprime cross-step identity, the finitely supported case, the empty-descent and o(1)-difference logarithmic rigidity results, and the Wirsing window-averaged shift existence hold without extra hypotheses beyond the stated ones. The remaining results carry distinct hypotheses: the K-window telescoping bound assumes a prefix jump bound and two endpoint range conditions; the Nat.log ratio squeeze assumes a prefix jump bound, power additivity, and a finite range condition; the dyadic-shell equivalence assumes coprime additivity, o(X) descent density, and bounded downward jumps, and concludes shell oscillation; the shell-cardinality and half-open shell oscillation hypotheses enter through separate rigidity reductions; and the two conditional reductions assume their stated uniformity hypotheses over every coprime-additive function with o(X) descent density. The conditional reductions state that the descent-count form `Erdos1122Conjecture` of the main conjecture follows from those extra hypotheses.",

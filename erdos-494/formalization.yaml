{
  "version": "v0.4",
  "project": {
    "name": "Erdős 494: sets determined by k-sum multisets",
    "description": "A Lean 4 formalization of the Selfridge–Straus uniqueness theorems for finite sets of complex numbers. For k = 2, a set is determined by the multiset of sums of its pairs unless its cardinality is a power of two. For k = 3, Selfridge and Straus (1958) prove the same conclusion when the cardinality is greater than 6 and is neither 27 nor 486. The formal statements follow the corresponding open variants in Erdős Problem 494; the general uniqueness problem for all k and cardinalities remains outside this package's scope.",
    "authors": [
      "Linmiao Xu"
    ],
    "responsible_maintainers": [
      "Linmiao Xu"
    ],

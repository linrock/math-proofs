      "note": "Proves that A ⊂ ℂ is uniquely determined by its k-sum multiset for k = 2 (|A| ≠ 2^l) and k = 3 (|A| > 6, |A| ∉ {27, 486}). The problem page is https://www.erdosproblems.com/494."

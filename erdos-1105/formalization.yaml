    "name": "Erdős 1105: anti-Ramsey numbers for cycles and paths",
    "description": "A Lean 4 formalization of the two known solved formulas in Erdős problem 1105 on the anti-Ramsey number AR(n, H), the maximum number of colors in a surjective edge-coloring of K_n with no rainbow copy of H. Part (i) formalizes the Erdős–Simonovits–Sós (1975) cycle formula AR(n, C_k) = ((k - 2) / 2 + 1 / (k - 1)) n + O(1) for every fixed k ≥ 3, proved by Montellano-Ballesteros and Neumann-Lara (2005), with Choi (2011) supplying the upper-bound approach, together with the exact triangle value AR(n, C_3) = n - 1 and explicit supporting two-sided bounds. Part (ii) formalizes the exact path formula for all n ≥ k ≥ 5, the range supplied by Yuan (2021); Simonovits–Sós (1984) proved it for large n, via representative-graph exchanges, finite host-window reduction, degree-core elimination, and 2-connected circumference bounds. The package proves the two displayed part statements; two trailing upstream TODO comments mention potential additional ESS75 and Simonovits–Sós variants but do not specify formal statements.",
    "authors": [
      "Linmiao Xu"
    ],

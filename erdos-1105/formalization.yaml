    "name": "Erdős 1105: anti-Ramsey numbers for cycles and paths",
    "description": "A complete Lean 4 proof of both parts of Erdős problem 1105 on the anti-Ramsey number AR(n, H), the maximum number of colors in a surjective edge-coloring of K_n with no rainbow copy of H. Part (i) proves the Erdős–Simonovits–Sós (1975) cycle formula AR(n, C_k) = ((k - 2) / 2 + 1 / (k - 1)) n + O(1) for every fixed k ≥ 3 (Montellano-Ballesteros and Neumann-Lara 2005; Choi 2011), together with the exact triangle value AR(n, C_3) = n - 1 and the explicit two-sided bounds ⌊n / (k - 1)⌋(choose(k - 1, 2) + 1) - 1 ≤ AR(n, C_k) ≤ ((k - 2) / 2 + 1 / (k - 1)) n - 1 for all n ≥ k ≥ 3 via private-color deletion and weak anticyclic block decompositions. Part (ii) proves the Simonovits–Sós (1984) and Yuan (2021) exact path formula AR(n, P_k) = max(choose(k - 2, 2) + 1, choose(ℓ - 1, 2) + (ℓ - 1)(n - ℓ + 1) + ε) for all n ≥ k ≥ 5, where ℓ = ⌊(k - 1) / 2⌋ and ε = 1 for odd k and 2 for even k, via representative-graph exchanges, finite host-window reduction, degree-core elimination, and 2-connected circumference bounds.",

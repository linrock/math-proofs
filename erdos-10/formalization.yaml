    "name": "Erdős 10: exceptions to prime plus powers of two",
    "description": "A Lean 4 formalization of excluded integers in Erdős's problem on a prime plus powers of two. Building on Crocker's 1971 Fermat-factor covering construction, it proves that 1117175146 is not the sum of a prime and at most three powers of two, the explicit example observed by Bogdan Grechuk. The development also gives alternative proofs of the infinite even-exception statements for two and three powers and records reductions toward the asymptotic conjecture, which remains open.",

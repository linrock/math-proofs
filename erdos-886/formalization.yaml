    "name": "Erdős 886: divisors in short intervals above √n",
    "description": "A Lean 4 formalization of unconditional results for Erdős Problem 886, attributed by Erdős to Ruzsa, on the number of divisors of n in the short interval (n^{1/2}, n^{1/2} + n^{1/2 - ε}). The package proves both Erdős–Rosenfeld variants from the 1997 Acta Arithmetica paper at the critical exponent ε = 1/4: there are infinitely many n with at least four divisors in (n^{1/2}, n^{1/2} + 16 n^{1/4}), and at most 1 + C² divisors lie in [n^{1/2}, n^{1/2} + C n^{1/4}] for every C > 0 and all sufficiently large n. It also proves unconditionally that the open interval contains at most one divisor for every ε ≥ 1/4, and derives the exact equivalence reducing the conjecture to the remaining window 0 < ε < 1/4. Supporting results include fifth-order hyperbolic Vandermonde determinant identities on 6-tuples of divisors, complementary-divisor GCD and LCM dualities, a four-factor coprime-cofactor decomposition, Finset LCM divisibility, and prime-power valuation bounds. The main conjecture erdos_886 remains open for 0 < ε < 1/4.",

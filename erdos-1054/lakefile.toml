name = "Erdos1054Palomar"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution", "AxiomAudit", "Statement"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "ArchitectProofs"
srcDir = "Proofs"
roots = ["Architect.Basic", "Architect.Command", "Architect.Content", "Architect.Attribute", "Architect.CollectUsed", "Architect.Tactic", "Architect.Output", "Architect.Load", "Architect"]
moreLeanArgs = ["-j1", "-M8192", "-E", "hasSorry"]

[[lean_lib]]
name = "PNTProofs"
srcDir = "Proofs"
roots = ["PrimeNumberTheoremAnd.Auxiliary", "PrimeNumberTheoremAnd.EulerMaclaurin", "PrimeNumberTheoremAnd.Fourier", "PrimeNumberTheoremAnd.Mathlib.Algebra.Notation.Support", "PrimeNumberTheoremAnd.Mathlib.Analysis.Asymptotics.Asymptotics", "PrimeNumberTheoremAnd.Mathlib.Analysis.Asymptotics.Uniformly", "PrimeNumberTheoremAnd.Mathlib.Analysis.SpecialFunctions.Log.Basic", "PrimeNumberTheoremAnd.MediumPNT", "PrimeNumberTheoremAnd.MellinCalculus", "PrimeNumberTheoremAnd.PerronFormula", "PrimeNumberTheoremAnd.Rectangle", "PrimeNumberTheoremAnd.ResidueCalcOnRectangles", "PrimeNumberTheoremAnd.SmoothExistence", "PrimeNumberTheoremAnd.Sobolev", "PrimeNumberTheoremAnd.Tactic.AdditiveCombination", "PrimeNumberTheoremAnd.Wiener", "PrimeNumberTheoremAnd.ZetaBounds", "PrimeNumberTheoremAnd.ZetaConj"]
moreLeanArgs = ["-j1", "-M8192", "-DautoImplicit=false", "-DrelaxedAutoImplicit=false", "-E", "hasSorry"]

[[lean_lib]]
name = "GoldbachProof"
srcDir = "Proofs"
roots = ["GoldbachCircleBase", "GoldbachSW1", "GoldbachSW2", "GoldbachSW3", "GoldbachRatedWindow", "GoldbachMajorArc", "GoldbachArcTail", "GoldbachChainMaster"]
moreLeanArgs = ["-j1", "-M16384", "-DautoImplicit=false", "-DrelaxedAutoImplicit=false", "-E", "hasSorry"]

[[lean_lib]]
name = "PrincipiaProofs"
srcDir = "Proofs"
roots = ["Erdos1054Conditional"]
moreLeanArgs = ["-j1", "-M16384", "-E", "hasSorry"]

[[lean_lib]]
name = "ResearchProofs"
srcDir = "Proofs"
roots = ["Aliquot1054", "AliquotEquivalence1054", "CofactorParity1054", "Integration1054", "OddTail1054", "OriginalNth1054", "SecondMoment1054", "SharpSecondMoment1054", "SmallRatioKovac1054", "StatementAudit1054", "Unconditional1054"]
moreLeanArgs = ["-j1", "-M16384", "-E", "hasSorry"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
moreLeanArgs = ["-j1", "-M8192"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
moreLeanArgs = ["-j1", "-M8192", "-E", "hasSorry"]

[[lean_lib]]
name = "AxiomAudit"
roots = ["AxiomAudit"]
moreLeanArgs = ["-j1", "-M8192", "-E", "hasSorry"]

[[lean_lib]]
name = "Statement"
roots = ["Statement"]
moreLeanArgs = ["-j1", "-M8192", "-E", "hasSorry"]

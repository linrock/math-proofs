    "name": "Erdős 1139: large gaps between almost-primes",
    "description": "A Lean 4 formalization of Erdős problem 1139 on large gaps between P_2 almost-primes (1 ≤ u_1 < u_2 < ⋯ with Ω(u_k) ≤ 2). Combining the Chinese Remainder Theorem, the Prime Number Theorem, and protected-reserve omission in the Erdős 689 three-prime matching construction, this package proves unconditionally that the normalized gap ratio satisfies limsup (u_{k+1} - u_k) / log(k + 1) ≥ A > 1 and that every sufficiently large height X contains an almost-prime-free interval [N + 1, N + y] ⊆ [1, X] of length y ≥ c log X for a fixed constant c > 1, alongside the mixed prime/prime-square CRT bridge, the PNT primorial conductor limit, the sublinear-conductor reduction to limsup = ∞, and the four-family deficiency classification for the squared-prime core. It also formalizes the complete conditional derivation of the Formal Conjectures infinite-limsup statement from the Green–Tao–Ziegler von Mangoldt linear-forms asymptotic and proves that this hypothesis implies arbitrary-length prime arithmetic progressions.",
    "authors": [
      "Linmiao Xu"
    ],

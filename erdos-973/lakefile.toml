name = "Erdos973Palomar"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution", "AxiomAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "ResearchProofs"
srcDir = "Proofs"
roots = ["Decay973", "ExteriorPowerSums973", "HigherMoments973", "MomentObstruction973", "NewtonBridge973", "Normalization973", "PolynomialBounds973", "Statement973", "TaylorResidual973", "TransformedRoots973", "ZeroSeparation973"]
moreLeanArgs = ["-j1", "-s65520", "-M24576", "-E", "hasSorry"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
moreLeanArgs = ["-E", "hasSorry"]

[[lean_lib]]
name = "AxiomAudit"
roots = ["AxiomAudit"]
moreLeanArgs = ["-E", "hasSorry"]

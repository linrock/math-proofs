    "name": "Exterior power sums cannot be exponentially small: Erdős 973",
    "description": "Lean proves the negative answer to Erdős 973 via a uniform bound: for each real C > 1, there is N(C) such that every n ≥ N(C) and z : Fin n → ℂ with |z_i| ≥ 1 has some 2 ≤ k ≤ n+1 with |∑_i z_i^k| > C^(-n). Repeated and unit-circle points are allowed, and the original z_1 = 1 condition is unnecessary. The proof uses a fixed-test-degree consequence of Tan–Wang–Huang–Chen's residual-polynomial method.",
    "authors": ["Linmiao Xu"],
    "responsible_maintainers": ["Linmiao Xu"],
    "license": "MIT"
  },

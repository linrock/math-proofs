    "name": "Erdős 973: power sums cannot all be exponentially small",
    "description": "A complete Lean 4 proof of the negative answer to Erdős problem 973: power sums of complex numbers on or outside the unit circle cannot all be exponentially small. For each fixed C > 1 and all sufficiently large n, any n such numbers have some order 2 ≤ k ≤ n+1 with |∑_i z_i^k| > C^(-n), even without the original condition z₁ = 1. The proof follows the residual-polynomial method in Tan, Wang, Huang, and Chen’s August 2026 paper “Residual bounds for Schur-stable polynomials,” using a fixed-degree polynomial test. This submission provides a complete machine-checked proof of the negative answer previously obtained by Luo, Yang, and Zhu.",

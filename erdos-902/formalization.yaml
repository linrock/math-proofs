    "scope": "Proves the exact values f(0) = 1, f(1) = 3, f(2) = 7 (via Paley QR_7), and f(3) = 19 (upper bound via Paley QR_19, lower bound 14 from a direct argument), the k = 4 bracket 47 <= f(4) <= 67 (via Paley QR_67), Erdős's lower bound f(k) >= 2^(k+1) - 1 and Szekeres–Szekeres's lower bound f(k) >= (k + 2) * 2^(k - 1) - 1 for all k >= 1, the finite orientation-space union-bound criterion and unit-leading probabilistic upper bounds f(n) <= n * (n + 1) * 2^n and f(n) <= n + (n^2 + 5) * 2^n for all n >= 1 (with f(n) <= n^2 * 2^n for all n >= 11), the general ZMod p / Fin p Paley tournament construction for primes p == 3 (mod 4), the deterministic second-moment pairwise out-neighborhood intersection criterion, and the falsification of ErdosProbabilisticCriterion n (n^2 * 2^n) for 1 <= n <= 10. Closing the asymptotic factor-n gap between Omega(n 2^n) and O(n^2 2^n) remains open.",

      "location": "Journal of Mathematics and Physics 12 (1933), 311–320",
      "author_endorsement": "not-contacted",
      "note": "Gives the quadratic-residue method for primes p ≡ 3 (mod 4). The paper constructs Hadamard matrices rather than tournaments; the package adapts the quadratic-residue method to the tournaments QR_7, QR_19, QR_67 and the general paleyFinDigraph construction."

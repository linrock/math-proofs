      "title": "On the method of paired comparisons",
      "authors": [
        "M. G. Kendall",
        "B. Babington Smith"
      ],
      "type": "paper",
      "relationship": "formalizes",
      "id": "https://doi.org/10.1093/biomet/31.3-4.324",
      "location": "Biometrika 31 (1940), 324–345",
      "author_endorsement": "not-contacted",
      "note": "Theorem (1) of §8 states that the maximum number of circular triads is (n³ − n)/24 for odd n and (n³ − 4n)/24 for even n, and theorem (2) that these limits are attained. Proofs/QuinticBinomialDecayAndKendallBabingtonSmithBounds902.lean formalizes the two upper bounds for every tournament, together with the equality case for regular odd-order tournaments and, in particular, for the Szekeres–Szekeres extremal tournaments. The statements were checked against the published text, §8 theorems (1) and (2), p. 328."
    }

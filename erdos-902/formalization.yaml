{
  "version": "v0.4",
  "project": {
    "name": "Erdős 902: Schütte's paradoxical tournaments",
    "description": "A Lean 4 formalization of bounds on f(n), the least number of vertices in a tournament in which every n vertices are dominated by a further vertex, a question posed by Schütte and studied by Erdős (1963) and by Szekeres and Szekeres (1965). The package proves Erdős's exponential lower bound and the Szekeres–Szekeres lower bound, the exact values f(1) = 3, f(2) = 7 and f(3) = 19 together with the bracket 47 ≤ f(4) ≤ 67, using Paley's (1933) quadratic-residue construction and its general form over Z/pZ for primes p ≡ 3 (mod 4). It also supplies probabilistic upper bounds and a second-moment criterion for paradoxicality, so that only the asymptotic factor n between the Ω(n 2^n) lower bound and the O(n² 2^n) upper bound remains open.",
    "authors": [
      "Linmiao Xu"
    ],
    "responsible_maintainers": [
      "Linmiao Xu"
    ],
    "license": "Apache-2.0"
  },
  "classification": {

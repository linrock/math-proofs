    "name": "Erdős 1198: Hindman's monochromatic finite-sums theorem",
    "description": "A Lean 4 formalization of the Hindman case of Erdős Problem 1198. For every two-colouring of the natural numbers, the package constructs a strictly increasing sequence of positive integers whose nonempty finite sums all receive the same colour. The proof applies the partition-regular form of Hindman's theorem (1974) to obtain a monochromatic finite-sums set, then groups that set into consecutive blocks whose sums are increasing. The main Smith-counterexample statement of Problem 1198 is not formalized.",

    "name": "Erdős 600: Ruzsa–Szemerédi bound for triangle-covered graphs",
    "description": "A Lean 4 formalization of the Ruzsa–Szemerédi upper bound for Erdős problem 600, which asks for the least number of edges that forces an edge of a triangle-covered graph to lie in r triangles. The proof routes dense triangle-covered graphs with no r-book to the far-from-triangle-free predicate and applies the triangle removal lemma, as formalized in Mathlib by Dillies and Mehta, together with a sharp cover-charge inequality. The principal result shows that this threshold is o(n²) for every fixed r, following Ruzsa and Szemerédi (1978), and the package also proves auxiliary results such as the identity at r = 2 with the locally linear extremal number, a Behrend lower bound, and Mantel–Turán type estimates. The two asymptotic questions that Erdős posed in 1987, about the step difference and the ratio of consecutive thresholds, remain open and are not claimed here.",
    "authors": [
      "Linmiao Xu"
    ],

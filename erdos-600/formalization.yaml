  "status": {
    "scope": "Proves the upstream variant `erdos_600.variants.ruzsa_szemeredi_upper_bound` exactly: for every fixed r, the minimal number of edges forcing an r-book in a triangle-covered n-vertex graph is o(n^2). The proof routes dense r-book-free triangle-covered graphs to the far-from-triangle-free predicate and applies Mathlib's formalization of the Dillies–Mehta triangle removal lemma, together with a sharp cover-charge inequality giving |E(G)| ≤ (2r - 1)(|E(G)| - |E(H)|) for a triangle-free subgraph H of G. Seventeen auxiliary theorems have no upstream Formal Conjectures declaration and are recorded as enhancements: an equivalence between locally linear graphs and triangle-covered graphs whose edges lie in fewer than two triangles, the exact identity e(n, 2) = 3 rs(n) + 1 with the locally linear extremal number, the Behrend lower bound n^2 exp(-4 sqrt(log n)) = O(e(n, r)) for r ≥ 2, the saturation dichotomy e(n, r) = C(n, 2) + 1 iff n - 1 ≤ r for n ≥ 3, disjoint-union superadditivity of the extremal edge count, a pointwise edge-degree-sum bound, a parity-tightened locally linear packing bound, a global Cauchy–Schwarz triangle-incidence inequality, a Mantel–Turán edge bound, weighted vertex-blowup identities for triangle multiplicity, admissibility and edge counts with uniform blow-up scaling, a non-neighbor triangle partition identity for locally linear graphs, a heavy-edge triangle-incidence bound, and a conditional reduction of the ratio question to deleting a sublinear number of edges. The asymptotic questions `erdos_600.parts.i` and `erdos_600.parts.ii` remain open and are not claimed.",

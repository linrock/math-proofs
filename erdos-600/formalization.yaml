  "acknowledgements": "The problem was posed by Paul Erdős (1987) on the growth of consecutive book thresholds in triangle-covered graphs. The upper bound formalized here is the theorem of Imre Z. Ruzsa and Endre Szemerédi (1978), and the sharpened edge count obtained in this package follows their triangle removal argument. The lower bound combines the three-term-progression-free construction of Felix A. Behrend (1946) with the Ruzsa–Szemerédi (1978) reduction from the progression-free extremal function (`rothNumberNat` in Mathlib, named after Klaus F. Roth, 1953) to the locally linear extremal number as formalized in Mathlib. The triangle removal lemma is a consequence of Szemerédi's regularity lemma, as used by Ruzsa and Szemerédi (1978); this package applies Mathlib's formalization of it by Yaël Dillies and Bhavik Mehta and does not reprove it. Mathlib and Formal Conjectures supply the underlying simple graph, asymptotic and extremal-number infrastructure."
}

    "name": "Erdős 423: Hofstadter consecutive-block-sum sequence",
    "description": "A Lean 4 formalization of Erdős Problem 423 on the asymptotic behaviour of Hofstadter's consecutive-block-sum sequence, which begins with 1 and 2 and thereafter takes the least eligible sum above its previous term. Following arguments of Bolan and Tang (2026), it proves that the excess a(n) - n is unbounded and that infinitely many positive integers are omitted; it also re-proves the nondecreasing-excess result, which is already formalized by Anatolii Ohorodnyk. Further results include uniqueness, omitted-value counting, prefix-difference bounds, and a completed-square obstruction to eventual linear growth. Conditional reductions relate explicit iterated-excess tower bounds to the remaining variants and the main asymptotic conjecture, whose hypotheses remain unproved and whose status remains open.",

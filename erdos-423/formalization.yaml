    "scope": "Proves the Formal Conjectures variants erdos_423.variants.unbounded and erdos_423.variants.infinite_complement: every Hofstadter consecutive-block-sum sequence has unbounded excess a(n) - n and omits infinitely many positive integers. Re-proves the variant erdos_423.variants.nondecreasing, which already has an independent registered Lean proof and is not claimed as new. The remaining solved variants erdos_423.variants.lower_bound and erdos_423.variants.upper_bound are addressed only as conditional reductions from control of the excess tower, not proved unconditionally. Also proves uniqueness of the sequence, exact omitted-value counting, global block-sum closure, prefix-difference bounds, non-eventual-linearity through a completed-square Ramanujan-Nagell obstruction, a finite stabilization-breaking horizon, and an explicit iterated excess tower. The main conjecture erdos_423, a(n) = n + o(n), remains open.",

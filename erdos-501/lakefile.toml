name = "Erdos501"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution", "AxiomAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "Proofs501"
srcDir = "Proofs"
roots = ["ErdosHajnalFinite501"]
moreLeanArgs = ["-M8192", "-E", "hasSorry"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
moreLeanArgs = ["-M8192"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
moreLeanArgs = ["-M8192", "-E", "hasSorry"]

[[lean_lib]]
name = "AxiomAudit"
roots = ["AxiomAudit"]
moreLeanArgs = ["-M8192", "-E", "hasSorry"]

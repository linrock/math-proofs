    "name": "Erdős 501: Erdős–Hajnal finite independent sets for small outer measure",
    "description": "A Lean 4 formalization of the Erdős and Hajnal (1960) finite independent-set theorem for Erdős Problem 501 on the real line. For every family of bounded subsets of the real line with Lebesgue outer measure strictly below one and every prescribed natural number n, the proof constructs a finite independent subset of size at least n via measure-subadditivity bounds on enclosing intervals and induction on n. The unrestricted question of whether every such family admits an infinite independent set in ZFC remains open.",

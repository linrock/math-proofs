    "name": "Erdős 918: shift graphs and local chromatic equality",
    "description": "A Lean 4 formalization of the Erdős and Hajnal (1968) shift-graph theorem under the generalized continuum hypothesis and the impossibility of the Erdős (1969) local chromatic equality formulations for Erdős Problem 918. Using the exact iterated power-set chromatic threshold for higher-order shift graphs on strictly increasing tuples, the development proves under the generalized continuum hypothesis that for every positive integer k there is a graph on ℵ_k vertices with chromatic cardinal ℵ₁ whose induced subgraphs on fewer than ℵ_k vertices are countably colorable. It also refutes all four textbook formulations that demand chromatic cardinal equal to ℵ₀ rather than at most ℵ₀ for subgraphs of size ℵ₁ or ℵ_ω, combining a successor-cardinal color-class pigeonhole independent-set argument for induced subgraphs with an edgeless-subgraph argument for arbitrary subgraphs and an exact ordinal dichotomy. The open upper-bound questions on graphs of size ℵ₂ and ℵ_{ω+1} remain unresolved in ZFC.",

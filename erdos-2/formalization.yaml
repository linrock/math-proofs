    "name": "Erdős 2: the minimum modulus of a distinct covering system is bounded",
    "description": "A qualitative Lean formalization of the published negative answer to Erdős problem 2. One natural bound applies to every finite covering of all signed integers by distinct positive natural moduli, independently of the number of moduli and the assigned residues. The Mathlib-only benchmark selects this uniform numerical theorem. The substantive development also proves the literal Formal Conjectures ideal statement and a finite-set noncoverage theorem. The proof follows the probability sieve of Balister, Bollobás, Morris, Sahasrabudhe and Tiba, with a fixed half-cap update and qualitative summable tails. No explicit numerical cutoff is extracted.",

    "name": "Erdős 2: minimum modulus of distinct covering systems",
    "description": "A complete Lean 4 proof of the negative answer to Erdős problem 2 (Hough 2015; Balister–Bollobás–Morris–Sahasrabudhe–Tiba 2022): there is an absolute constant B such that every finite covering of the integers by distinct moduli > 1 contains a modulus ≤ B. For any finite set D of moduli above B with N = lcm(D), the proof builds a probability measure on ZMod N prime by prime via the BBMST half-cap fiber update, preserving the progression bound w(z ≡ a mod d) ≤ 2^ω(d)/d while bounding each prime-p loss by C (log p)^6 / (p - 1)^2 via Euler factorization and Mertens' third theorem. Combining this summable tail with Euler's product bound on A-smooth reciprocals keeps the covered mass below 1/2, proving the Formal Conjectures ideal statement (erdos_2), its direct negation (not_arbitrarilyLarge_ideal_coverings), the uniform minimum-modulus bound (minimum_modulus_bound), and finite-set noncoverage (finite_noncoverage_bound).",

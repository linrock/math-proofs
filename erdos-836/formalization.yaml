  "project": {
    "name": "Erd\u0151s 836: vertex counts and pairwise edge intersections in 3-chromatic intersecting uniform hypergraphs",
    "description": "A complete Lean 4 resolution of both parts of Erd\u0151s problem 836 (posed by Erd\u0151s and Shelah; Erd\u0151s and Lov\u00e1sz, 1975) on 3-chromatic intersecting r-uniform hypergraphs, together with structural bounds on the Erd\u0151s\u2013Shelah codimension-one avoidance question. For Part (i), it formalizes Noga Alon's equitable-partition construction with (2r - 2) + C(2r - 2, r - 1) / 2 active vertices to disprove the O(r\u00b2) vertex bound for all r \u2265 2. For Part (ii), it adapts and generalizes Liam Price's minimal-blue bipartite double-counting argument to prove the universal bound r \u2264 2t + 1 when distinct edges meet in at most t vertices, establishing that every 3-chromatic intersecting r-uniform hypergraph has two distinct edges meeting in at least r/3 vertices, that linear intersecting hypergraphs are 2-colourable for r \u2265 4, and that avoiding pairwise intersection r - 1 forces minimum degree \u2265 3, degree \u2265 4 on multi-intersections, and |E(H)|, |V(H)| \u2265 9 at r = 4.",
    "authors": [
      "Linmiao Xu"
    ],
    "responsible_maintainers": [
      "Linmiao Xu"
    ],

    "name": "Erdős 692: a valley in the divisor-interval density",
    "description": "A Lean 4 formalization of Cambie's (2025) counterexample to unimodality of delta_1(n,m), the natural density of integers with exactly one divisor in (n,m). The proof computes the periodic residue counts delta_1(3,6) = 7/20, delta_1(3,7) = 1/3 and delta_1(3,8) = 38/105, adapted from Pietro Monticone's Lean gist, and supplies the missing step that the periodic proportion is the natural density of the Formal Conjectures definition. That bridge turns the rational comparison into an inequality for every admissible density function, so the upstream declaration is proved exactly rather than for one choice of delta.",

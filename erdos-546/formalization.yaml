    "name": "Erdős 546: sparse graph Ramsey numbers (Sudakov's theorem)",
    "description": "A complete Lean 4.35.0-rc2 proof of the affirmative answer to Erdős problem 546 (Sudakov 2011): there exists an absolute constant C > 0 such that every finite simple graph G with m edges and no isolated vertices has diagonal Ramsey number R(G) <= 2^(C * sqrt(m)). Formalizing Sudakov's high/low-degree deletion, greedy bounded-degree embedding contrapositive, hereditary sparse-cut extraction, low-density dependent random choice, and density-amplification iteration, this package proves the uniform explicit bound R(G) <= 2^(4000 * sqrt(m)) across all finite simple graphs on arbitrary Fintype vertex types V (including m = 0), together with the exact Formal Conjectures statement.",

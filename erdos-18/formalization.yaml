  "project": {
    "name": "Erdős 18: Practicality of factorials and the bound on h(n!)",
    "description": "A Lean 4 formalization of two classical results on representing integers as sums of distinct divisors of factorials, in the setting of Erdős Problem 18. A positive integer n is practical when every m ≤ n is a sum of distinct divisors of n, and for a practical n the function h(n) is the largest, over 1 ≤ m ≤ n, of the least number of distinct divisors of n whose sum is m. The package proves that n! is practical for every n (a textbook fact), and that h(n!) < n for all sufficiently large n, which is the classical linear upper bound of Erdős and Graham (1980); stronger asymptotic bounds of order n / log n are known from later literature. The conjectures erdos_18a, erdos_18b, and erdos_18c on the true order of h(n!) remain open and are not resolved here.",

name: Verify Proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      problems:
        description: "Optional comma-separated erdos-<N> list to build (leave blank for preflight-only, or 'all')"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEAN_TOOLCHAIN: "leanprover/lean4:v4.35.0-rc2"
  MATHLIB_REV: "065356127b1dc0016f66b7283ce0ce2c4055aa55"
  FC_COMMIT: "bdda9748e16d1df263db93d5241011fb399abfae"

jobs:
  preflight:
    name: Preflight & manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select target packages and validate manifests
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_PROBLEMS: ${{ inputs.problems }}
          FC_COMMIT: ${{ env.FC_COMMIT }}
        run: |
          BASE_SHA="$EVENT_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          fi
          python3 .github/scripts/verify_proofs.py plan \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --base-ref "$PR_BASE_REF" \
            --head-sha "$HEAD_SHA" \
            --problems "$INPUT_PROBLEMS" \
            --github-output "$GITHUB_OUTPUT"
          test "$FC_COMMIT" = "bdda9748e16d1df263db93d5241011fb399abfae"

  verify:
    name: Verify ${{ matrix.package }}
    needs: preflight
    if: ${{ needs.preflight.outputs.has_packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        package: ${{ fromJson(needs.preflight.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap jq zstd
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Restore Elan and Mathlib ltar cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
          key: lean435-ltar-${{ env.MATHLIB_REV }}-v1

      - name: Restore pinned FormalConjectures olean cache
        uses: actions/cache@v6
        with:
          path: fc-shared-lib/FormalConjectures
          key: formal-conjectures-oleans-${{ env.FC_COMMIT }}-v1

      - name: Ensure Elan and pinned Lean toolchain
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          if ! command -v elan >/dev/null 2>&1; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain "$LEAN_TOOLCHAIN"
          fi
          elan toolchain install "$LEAN_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run package verification and environment audit
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID_VAL: ${{ github.run_id }}
          FC_LEAN_LIB_DIR: ${{ github.workspace }}/fc-shared-lib
          FC_COMMIT: ${{ env.FC_COMMIT }}
          FC_GIT_DIR: ${{ github.workspace }}/../formal-conjectures
        run: |
          mkdir -p "$(dirname "$FC_GIT_DIR")" "$FC_LEAN_LIB_DIR"
          mkdir -p "$FC_LEAN_LIB_DIR/FormalConjectures/ErdosProblems"
          if [ ! -d "$FC_GIT_DIR/.git" ]; then
            git clone --filter=blob:none --no-checkout https://github.com/google-deepmind/formal-conjectures.git "$FC_GIT_DIR"
          fi
          git -C "$FC_GIT_DIR" fetch --force origin "$FC_COMMIT"
          git -C "$FC_GIT_DIR" checkout --detach --force "$FC_COMMIT"
          git -C "$FC_GIT_DIR" clean -fdx
          cp "$FC_GIT_DIR"/FormalConjectures/ErdosProblems/*.olean "$FC_LEAN_LIB_DIR/FormalConjectures/ErdosProblems/" 2>/dev/null || true
          python3 .github/scripts/verify_proofs.py verify \
            --package "$MATRIX_PACKAGE" \
            --comparator \
            --fc-lib-dir "$FC_LEAN_LIB_DIR" \
            --commit "$COMMIT_SHA" \
            --repo "$GITHUB_REPO" \
            --run-id "$GITHUB_RUN_ID_VAL" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Finalize interrupted verification receipt
        if: always()
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID_VAL: ${{ github.run_id }}
        run: |
          python3 .github/scripts/verify_proofs.py finalize \
            --package "$MATRIX_PACKAGE" \
            --comparator \
            --commit "$COMMIT_SHA" \
            --repo "$GITHUB_REPO" \
            --run-id "$GITHUB_RUN_ID_VAL" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload verification logs and receipt
        id: upload1
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.package }}-${{ github.sha }}
          path: ${{ matrix.package }}/.verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Retry verification artifact upload
        if: always() && steps.upload1.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.package }}-${{ github.sha }}
          path: ${{ matrix.package }}/.verification/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  gate:
    name: Verification gate
    needs: [preflight, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download package verification artifacts
        id: download_artifacts
        continue-on-error: true
        if: always() && needs.preflight.outputs.has_packages == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: verification-*-${{ github.sha }}
          path: artifacts

      - name: Aggregate package receipts
        id: aggregate
        continue-on-error: true
        if: always() && needs.preflight.outputs.has_packages == 'true'
        env:
          EXPECTED_PACKAGES: ${{ needs.preflight.outputs.packages }}
        run: |
          python3 .github/scripts/verify_proofs.py aggregate \
            --artifacts-dir artifacts \
            --expected-packages "$EXPECTED_PACKAGES" \
            --output verification-report.json \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated verification report
        if: always() && needs.preflight.outputs.has_packages == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verification-report-${{ github.sha }}
          path: verification-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Check preflight and package verification results
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          HAS_PACKAGES: ${{ needs.preflight.outputs.has_packages }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
            echo "Preflight failed with result: $PREFLIGHT_RESULT" >&2
            exit 1
          fi
          if [[ "$HAS_PACKAGES" == "true" && "$VERIFY_RESULT" != "success" ]]; then
            echo "Package verification failed with result: $VERIFY_RESULT" >&2
            exit 1
          fi
          if [[ "$HAS_PACKAGES" == "true" && "$AGGREGATE_OUTCOME" != "success" ]]; then
            echo "Consolidated verification receipt check failed: $AGGREGATE_OUTCOME" >&2
            exit 1
          fi

  publish:
    name: Publish persistent verification records
    needs: [preflight, verify, gate]
    if: >-
      success() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.preflight.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-verification-records
      cancel-in-progress: false
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download package verification artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: verification-*-${{ github.sha }}
          path: artifacts

      - name: Prepare verification-records worktree
        run: |
          if git ls-remote --exit-code --heads origin verification-records >/dev/null 2>&1; then
            git fetch origin verification-records:refs/remotes/origin/verification-records
            git worktree add -B verification-records records-branch origin/verification-records
          else
            git worktree add --detach records-branch
            git -C records-branch checkout --orphan verification-records
            git -C records-branch rm -rf . >/dev/null 2>&1 || true
            git -C records-branch clean -fd >/dev/null 2>&1 || true
          fi

      - name: Update, commit, and push verification-records branch
        env:
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID_VAL: ${{ github.run_id }}
        run: |
          for attempt in 1 2 3; do
            if [[ "$attempt" -gt 1 ]] && git ls-remote --exit-code --heads origin verification-records >/dev/null 2>&1; then
              git fetch origin verification-records:refs/remotes/origin/verification-records
              git -C records-branch reset --hard origin/verification-records
              git -C records-branch clean -fd >/dev/null 2>&1 || true
            fi
            python3 .github/scripts/verify_proofs.py publish-records \
              --records-dir records-branch \
              --artifacts-dir artifacts \
              --commit "$COMMIT_SHA" \
              --repo "$GITHUB_REPO" \
              --run-id "$GITHUB_RUN_ID_VAL"
            git -C records-branch add -A
            if git -C records-branch diff --cached --quiet; then
              echo "No verification record changes to publish."
              exit 0
            fi
            GIT_AUTHOR_NAME="Linmiao Xu" \
            GIT_AUTHOR_EMAIL="linmiao.xu@gmail.com" \
            GIT_COMMITTER_NAME="Linmiao Xu" \
            GIT_COMMITTER_EMAIL="linmiao.xu@gmail.com" \
            git -C records-branch commit -m "Verification records: ${COMMIT_SHA} (run ${GITHUB_RUN_ID_VAL})"
            if git -C records-branch push origin HEAD:refs/heads/verification-records; then
              exit 0
            fi
          done
          exit 1

    "name": "Erdős 667: monotonicity and Ramsey bounds for locally dense clique exponents",
    "description": "A Lean 4 formalization of the solved variants and Ramsey lower bounds for the Erdős, Faudree, Rousseau, and Schelp (1994) clique-growth exponent for graphs whose p-vertex sets each span at least q edges. Erdős and Szekeres’s 1935 binomial Ramsey theorem gives the universal bound 1/(p-1) ≤ c(p,q) for p ≥ 2 and q ≥ 1. Definition monotonicity proves that c(p,q) is nondecreasing in q, and the endpoint q = C(p-1,2)+1 has exponent 1. The Erdős conjecture that this exponent is strictly increasing remains open.",

    "name": "Erdős 726: upper-half prime-residue reciprocal sums and Mertens reductions",
    "description": "A Lean 4 formalization of reductions for the 1975 Erdős–Graham–Ruzsa–Straus question of whether the reciprocal sum of primes p ≤ n whose residue n mod p lies in (p/2, p) is asymptotic to (log log n)/2. Adapting the second Mertens theorem from PrimeNumberTheoremAnd, it proves ∑_{p ≤ n} 1/p ~ log log n unconditionally. Kummer-carry equivalences, quotient-window and modular-reflection decompositions, and Abel summation with explicit PNT-remainder and discretization bounds reduce the open conjecture to vanishing of a signed small-prime tail relative to log log n.",

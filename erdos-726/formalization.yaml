    "name": "Erdős 726: upper-half prime-residue reciprocal sums and Mertens reductions",
    "description": "A Lean 4 formalization of reductions for the 1975 Erdős–Graham–Ruzsa–Straus question on whether the reciprocal sum of primes p <= n whose residue n mod p lies in (p/2, p) is asymptotic to (log log n)/2. The package formalizes the second Mertens theorem, adapting the PrimeNumberTheoremAnd development, to prove sum_{p <= n} 1/p ~ log log n. It then establishes Kummer-carry equivalences, quotient-window and modular-reflection decompositions, and Abel summation with explicit prime-number-theorem remainder and discretization bounds, reducing the open conjecture to vanishing of a signed small-prime tail relative to log log n. These reductions do not resolve the conjecture.",

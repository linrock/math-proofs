  "project": {
    "name": "Erdős 1180: representing residues as sums of modular inverses with small denominators",
    "description": "A complete Lean 4 proof of Erdős problem 1180 and its quantitative variants on representing every residue modulo a prime p as a sum of at most C(ε) modular inverses n⁻¹ (mod p) with 1 ≤ n ≤ p^ε and gcd(n, p) = 1. Formalizing Glibichuk's 8-fold bilinear covering theorem via additive energy and Cauchy–Davenport together with an inductive asymmetric two-block prime-reciprocal construction, this development proves the affirmative existence theorem for all ε > 0 and all primes p, the discrete large-prime bound C_asymp(ε) ≤ 8(⌊1/ε⌋ + 1)² = (8 + o(1))ε⁻² (and ≤ 32ε⁻² uniformly on (0, 1]), the asymmetric staircase bounds C_asymp(ε) ≤ 8k(k + 1) whenever (2k + 1)ε > 2 and C_asymp(ε) ≤ 8k whenever (2k - 1)ε > k (giving C_asymp(ε) ≤ 16 for ε > 2/3 and ≤ 24 for ε > 3/5), and Shparlinski's O(ε⁻³) bound. It also proves the large-prime pigeonhole lower bound 1/ε ≤ ⌈1/ε⌉ ≤ C_asymp(ε), the small-prime exponential lower bound 2^(1/ε) ≤ 4 C(ε), the strict separation C_asymp(1/n) < C(1/n) for all n ≥ 15, and the disproof of the unthresholded all-primes optimality statement.",
    "authors": [
      "Linmiao Xu"
    ],

  "status": {
    "scope": "Proves the main existence theorem of Erdős problem 1180, Glibichuk's discrete 8(⌊ε⁻¹⌋₊ + 1)², asymptotic (8 + η)ε⁻², and uniform 32ε⁻² large-prime bounds, the asymmetric staircase bounds C_asymp(ε) ≤ 8k(k + 1) for (2k + 1)ε > 2 and C_asymp(ε) ≤ 8k for (2k - 1)ε > k (giving C_asymp(ε) ≤ 16 for ε > 2/3), Shparlinski's O(ε⁻³) large-prime bound, both the all-primes and thresholded large-prime pigeonhole formulations of the Ω(ε⁻¹) lower bound, the sharp asymptotic lower bounds ε⁻¹ ≤ ⌈ε⁻¹⌉₊ ≤ C_asymp(ε), the 2^(ε⁻¹) ≤ 4 C(ε) small-prime lower bound, the strict separation C_asymp(n⁻¹) < C(n⁻¹) for n ≥ 15, and the disproof of the unthresholded all-primes optimality statement. Whether the large-prime threshold constant satisfies C_asymp(ε) ≤ ε^(-1-o(1)) (formalized here as Erdos1180AsymptoticOptimalConjecture) remains open.",
